name: Test, Deploy Functions, Deploy Pages

# 코디세이(codyssey-calendar)의 CI 기준에 맞춘 단일 워크플로우 —
# lint+테스트 통과 → functions 배포 → (성공해야) Pages 배포, 순서 강제.
# 포스터 스튜디오는 Firestore/Storage를 아예 안 써서(사진은 처리 직후 삭제,
# DB 미사용 — CLAUDE.md 참고) 코디세이의 "Firestore 규칙 에뮬레이터 테스트"에
# 대응하는 단계는 없다.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm ci
        working-directory: public
      - run: npm run lint
        working-directory: public
      - run: npm test
        working-directory: public

  deploy-functions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # github-actions-deploy 서비스 계정은 project-level roles/secretmanager.secretAccessor
      # (값 읽기, secrets.versions.access) + roles/secretmanager.viewer(존재/메타데이터
      # 조회, secrets.get — firebase-tools가 배포 시점에 필요) 둘 다 있어야 한다.
      # Secret Accessor 하나만으로는 secrets.get이 없어서 배포가 403으로 막힌다
      # (2026-08-29 실제로 겪고 원인 확인함).
      - run: npx firebase-tools deploy --only functions --project inky-poster-studio --non-interactive
      # 5차 감사 발견: API_BASE/ALLOWED_ORIGINS/BOOTH_TOKEN 3곳이 수동 동기화 지점이라
      # 하나만 어긋나도 부스 전체가 조용히 401로 죽을 수 있다. 배포 직후 실제로
      # public/app.js에 박힌 부스토큰으로 라이브 /generate를 호출해 401이 아닌지
      # (사진이 없으니 400이 정상) 확인한다 — 이게 실패하면 deploy-pages도 안 나간다.
      - name: 부스토큰 스모크테스트 (배포 직후 실제 인증 확인)
        run: |
          TOKEN=$(node -pe "require('fs').readFileSync('public/app.js','utf8').match(/const BOOTH_TOKEN = '([^']+)'/)[1]")
          STATUS=$(curl -s -o /tmp/smoke.json -w "%{http_code}" \
            -X POST -H "x-booth-token: $TOKEN" -H "content-type: application/json" -d '{}' \
            "https://asia-northeast3-inky-poster-studio.cloudfunctions.net/posterStudio/generate")
          echo "응답 상태: $STATUS, 본문: $(cat /tmp/smoke.json)"
          if [ "$STATUS" = "401" ]; then
            echo "::error::부스토큰 인증 실패(401) — app.js의 BOOTH_TOKEN과 Firebase Secret Manager 값이 어긋났을 수 있습니다."
            exit 1
          fi

  deploy-pages:
    needs: [test, deploy-functions]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
