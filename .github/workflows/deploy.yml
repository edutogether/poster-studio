name: Test, Deploy Functions, Deploy Hosting

# 코디세이(codyssey-calendar)의 CI 기준에 맞춘 단일 워크플로우 —
# lint+테스트 통과 → functions 배포 → (성공해야) Hosting 배포, 순서 강제.
# 2026-09-01: 프론트엔드 배포처를 GitHub Pages → Firebase Hosting(poster-studio
# 사이트, https://poster-studio.web.app)으로 이전 — Functions를 이미 쓰고 있어서
# Hosting을 같은 프로젝트에 추가하는 것뿐이고, firebase.json에 코디세이 패턴의
# 보안헤더(CSP 등)도 같이 적용했다(단 Permissions-Policy의 camera는 이 앱 핵심기능이라
# camera=(self)로 조정 — 코디세이의 camera=()를 그대로 쓰면 웹캠이 막힌다).
# 포스터 스튜디오는 Firestore를 순수 숫자 카운터(레이트리밋·사진별 생성한도) 용도로만
# 쓰고 클라이언트가 Firestore에 직접 접근하는 경로가 없다(서버 Admin SDK 전용) —
# 그래서 코디세이의 "Firestore 규칙 에뮬레이터 테스트"에 대응하는 단계가 없다(클라이언트
# 접근을 통제하는 규칙 자체가 이 구조에선 무의미). Storage는 정말 안 쓴다(사진은 처리
# 직후 삭제). functions/SECURITY_NOTES.md 참고.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm ci
        working-directory: public
      - run: npm run lint
        working-directory: public
      - run: npm test
        working-directory: public

  deploy-functions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # github-actions-deploy 서비스 계정은 project-level roles/secretmanager.secretAccessor
      # (값 읽기, secrets.versions.access) + roles/secretmanager.viewer(존재/메타데이터
      # 조회, secrets.get — firebase-tools가 배포 시점에 필요) 둘 다 있어야 한다.
      # Secret Accessor 하나만으로는 secrets.get이 없어서 배포가 403으로 막힌다
      # (2026-08-29 실제로 겪고 원인 확인함).
      - run: npx firebase-tools deploy --only functions --project inky-poster-studio --non-interactive
      # 5차 감사 발견: API_BASE/ALLOWED_ORIGINS/BOOTH_TOKEN 3곳이 수동 동기화 지점이라
      # 하나만 어긋나도 부스 전체가 조용히 401로 죽을 수 있다. 배포 직후 실제로
      # 클라이언트에 박힌 부스토큰으로 라이브 /generate를 호출해 401이 아닌지
      # (사진이 없으니 400이 정상) 확인한다 — 이게 실패하면 deploy-hosting도 안 나간다.
      # ES모듈 전환(2026-08-30)으로 BOOTH_TOKEN이 public/app.js에서 public/constants.js로
      # 옮겨졌다 — 이 스크립트도 같이 옮겨야 했는데 처음엔 놓쳐서 배포가 한 번 실패했음.
      - name: 부스토큰 스모크테스트 (배포 직후 실제 인증 확인)
        run: |
          TOKEN=$(node -pe "require('fs').readFileSync('public/constants.js','utf8').match(/const BOOTH_TOKEN = '([^']+)'/)[1]")
          STATUS=$(curl -s -o /tmp/smoke.json -w "%{http_code}" \
            -X POST -H "x-booth-token: $TOKEN" -H "content-type: application/json" -d '{}' \
            "https://asia-northeast3-inky-poster-studio.cloudfunctions.net/posterStudio/generate")
          echo "응답 상태: $STATUS, 본문: $(cat /tmp/smoke.json)"
          if [ "$STATUS" = "401" ]; then
            echo "::error::부스토큰 인증 실패(401) — app.js의 BOOTH_TOKEN과 Firebase Secret Manager 값이 어긋났을 수 있습니다."
            exit 1
          fi

  deploy-hosting:
    needs: [test, deploy-functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npx firebase-tools deploy --only hosting:poster-studio --project inky-poster-studio --non-interactive
      # 새 주소가 실제로 뜨는지, CORS(ALLOWED_ORIGINS)가 이 주소를 허용하는지, 새로
      # 적용한 CSP가 정상 스크립트 로드를 안 막는지까지 배포 직후 바로 확인한다.
      - name: 배포 직후 라이브 확인 (200 응답 + CORS 허용)
        run: |
          STATUS=$(curl -s -o /tmp/hosting.html -w "%{http_code}" "https://poster-studio.web.app/")
          echo "홈페이지 응답: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Firebase Hosting이 200을 안 준다(상태: $STATUS)"
            exit 1
          fi
          CORS_HEADER=$(curl -s -D - -o /dev/null \
            -H "Origin: https://poster-studio.web.app" \
            -X OPTIONS "https://asia-northeast3-inky-poster-studio.cloudfunctions.net/posterStudio/generate" \
            | grep -i "access-control-allow-origin" || true)
          echo "CORS 헤더: $CORS_HEADER"
          if [ -z "$CORS_HEADER" ]; then
            echo "::error::새 Hosting 주소가 functions/index.js의 ALLOWED_ORIGINS에 없을 수 있습니다."
            exit 1
          fi
