name: Test, Deploy Functions, Deploy Pages

# 코디세이(codyssey-calendar)의 CI 기준에 맞춘 단일 워크플로우 —
# lint+테스트 통과 → functions 배포 → (성공해야) Pages 배포, 순서 강제.
# 포스터 스튜디오는 Firestore/Storage를 아예 안 써서(사진은 처리 직후 삭제,
# DB 미사용 — CLAUDE.md 참고) 코디세이의 "Firestore 규칙 에뮬레이터 테스트"에
# 대응하는 단계는 없다.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm test
        working-directory: public

  deploy-functions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # 진단용: Secret Manager 권한 오류가 IAM에 부여한 계정과 실제로 CI가 쓰는
      # 계정이 일치하는지 확인하기 위해 이메일만 출력한다(민감정보 아님, 키 내용 아님).
      - run: echo "CI가 인증한 서비스 계정 이메일:"; jq -r .client_email "$GOOGLE_APPLICATION_CREDENTIALS"
      # 진단용: firebase-tools를 거치지 않고 같은 REST 엔드포인트를 access token으로
      # 직접 호출해, IAM 자체 문제인지 firebase-tools 쪽 문제인지 구분한다.
      # (token_format:'access_token'을 auth 액션에 직접 주면 iam.serviceAccounts.getAccessToken
      #  라는 또다른 권한이 필요해져서 실패했다 — 그래서 키 파일로 직접 gcloud 토큰을 발급받는다.)
      - run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          TOKEN=$(gcloud auth print-access-token)
          echo "Secret Manager REST 직접 호출 결과:"
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            "https://secretmanager.googleapis.com/v1/projects/inky-poster-studio/secrets/OPENAI_API_KEY"
      - run: npx firebase-tools deploy --only functions --project inky-poster-studio --non-interactive

  deploy-pages:
    needs: [test, deploy-functions]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
