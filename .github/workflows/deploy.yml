name: Test, Deploy Functions, Deploy Hosting

# 코디세이(codyssey-calendar)의 CI 기준에 맞춘 단일 워크플로우 —
# lint+테스트 통과 → functions 배포 → (성공해야) Hosting 배포, 순서 강제.
# 2026-09-01: 프론트엔드 배포처를 GitHub Pages → Firebase Hosting(poster-studio
# 사이트, https://poster-studio.web.app)으로 이전 — Functions를 이미 쓰고 있어서
# Hosting을 같은 프로젝트에 추가하는 것뿐이고, firebase.json에 코디세이 패턴의
# 보안헤더(CSP 등)도 같이 적용했다(단 Permissions-Policy의 camera는 이 앱 핵심기능이라
# camera=(self)로 조정 — 코디세이의 camera=()를 그대로 쓰면 웹캠이 막힌다).
# 포스터 스튜디오는 Firestore를 순수 숫자 카운터(레이트리밋·사진별 생성한도) 용도로만
# 쓰고 클라이언트가 Firestore에 직접 접근하는 경로가 없다(서버 Admin SDK 전용) —
# 그래서 코디세이의 "Firestore 규칙 에뮬레이터 테스트"에 대응하는 단계가 없다(클라이언트
# 접근을 통제하는 규칙 자체가 이 구조에선 무의미). Storage는 정말 안 쓴다(사진은 처리
# 직후 삭제). functions/security-notes.md 참고.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
      # 프론트엔드는 2026-09-09 리액트+TS 전환으로 저장소 루트가 프로젝트 루트다
      # (예전엔 public/이 소스이자 배포 폴더였다). public/은 이제 정적 자산만 담는다.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # 폰트 서브셋에 빠진 글자가 없는지(2026-09-09). 문구가 바뀌었는데 서브셋을
      # 다시 안 만들면 그 글자가 화면에 □ 로 나온다 — 배포 전에 막는다.
      # master의 CI에는 있었는데 전환 브랜치로 옮기며 빠져 있었다.
      - run: npm run fonts:check
      - run: npm test
      # 전환 검증 도구가 "빈 게이트"가 아닌지 매번 확인한다(CONVENTIONS §5.4).
      # 이게 통과해야 대조 결과의 "차이 0건"을 신뢰할 수 있다.
      - run: npm run verify:selftest

  deploy-functions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # github-actions-deploy 서비스 계정은 project-level roles/secretmanager.secretAccessor
      # (값 읽기, secrets.versions.access) + roles/secretmanager.viewer(존재/메타데이터
      # 조회, secrets.get — firebase-tools가 배포 시점에 필요) 둘 다 있어야 한다.
      # Secret Accessor 하나만으로는 secrets.get이 없어서 배포가 403으로 막힌다
      # (2026-08-29 실제로 겪고 원인 확인함).
      - run: npx firebase-tools deploy --only functions --project inky-poster-studio --non-interactive
      # 5차 감사 발견: API_BASE/ALLOWED_ORIGINS/BOOTH_TOKEN 3곳이 수동 동기화 지점이라
      # 하나만 어긋나도 부스 전체가 조용히 401로 죽을 수 있다. 배포 직후 실제로
      # 클라이언트에 박힌 부스토큰으로 라이브 /generate를 호출해 401이 아닌지
      # (사진이 없으니 400이 정상) 확인한다 — 이게 실패하면 deploy-hosting도 안 나간다.
      # ES모듈 전환(2026-08-30)으로 BOOTH_TOKEN이 public/app.js에서 public/constants.js로,
      # 리액트+TS 전환(2026-09-09)으로 src/constants.js를 거쳐 src/constants.ts가 됐다 — 파일을 옮길
      # 때마다 이 경로를 같이 안 고쳐 배포가 실패한 적이 있다. 소스를 문자열로 읽는
      # 지점이라 번들러가 개입하지 않는 원본 파일을 가리켜야 한다.
      - name: 부스토큰 스모크테스트 (배포 직후 실제 인증 확인)
        run: |
          TOKEN=$(node -pe "require('fs').readFileSync('src/constants.ts','utf8').match(/const BOOTH_TOKEN = '([^']+)'/)[1]")
          STATUS=$(curl -s -o /tmp/smoke.json -w "%{http_code}" \
            -X POST -H "x-booth-token: $TOKEN" -H "content-type: application/json" -d '{}' \
            "https://asia-northeast3-inky-poster-studio.cloudfunctions.net/posterStudio/generate")
          echo "응답 상태: $STATUS, 본문: $(cat /tmp/smoke.json)"
          # 🔴 "401이 아니면 통과"였다가 고쳤다(2026-09-09). 그 형태는 **틀린 답 하나만**
          # 잡는다 — 500·404·배포 실패로 함수가 아예 없을 때, 심지어 curl이 연결을 못 해
          # 000을 줄 때도 전부 통과했다. 검사는 "틀리지 않았다"가 아니라 "맞다"를 봐야 한다.
          # 기대값은 400이다(사진이 없는 요청이므로).
          case "$STATUS" in
            400)
              echo "부스토큰 정상 — 사진 없는 요청이라 400이 기대값이다."
              ;;
            401)
              echo "::error::부스토큰 인증 실패(401) — src/constants.ts의 BOOTH_TOKEN과 Firebase Secret Manager 값이 어긋났을 수 있습니다."
              exit 1
              ;;
            429)
              # 레이트리밋은 토큰 문제가 아니다. 다만 이번 실행에서는 인증을 확인하지
              # 못한 것이므로 통과시키되 조용히 넘어가지는 않는다.
              echo "::warning::레이트리밋(429)이라 이번엔 부스토큰 인증을 확인하지 못했습니다."
              ;;
            *)
              echo "::error::예상 밖 응답($STATUS) — 400(정상)/401(토큰 불일치)/429(레이트리밋) 중 하나여야 합니다. 함수가 제대로 배포됐는지 확인하세요."
              exit 1
              ;;
          esac

  deploy-hosting:
    needs: [test, deploy-functions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 2026-09-09 리액트+TS 전환으로 빌드 단계가 처음 생겼다. 배포되는 것은
      # 소스(public/)가 아니라 산출물(dist/)이다 — firebase.json의 hosting.public 참고.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      # public/의 내용은 dist/ 루트로 그대로 복사된다 — 거기에 있으면 안 될 것이
      # 섞여 들어가면 그대로 라이브에 서빙된다. 머지 직전에 실제로 겪었다:
      # 옛 배치가 남긴 public/node_modules(vitest 캐시)가 dist/node_modules로
      # 복사돼 있었다. 이 저장소는 같은 함정(public/vitest.config.js)을 이미
      # 한 번 겪은 곳이라 검사로 고정한다.
      - name: dist에 나가면 안 되는 것이 없는지
        run: |
          # 🔴 빈 게이트 방지(COMMON_STANDARDS §21-1). 아래 목록 검사는 dist/가 아예
          # 없거나 비어 있으면 **찾을 게 없어서 그대로 통과한다** — 빌드가 조용히
          # 아무것도 안 냈을 때가 정확히 그 경우다. 먼저 배포할 것이 실제로 있는지 본다.
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html이 없습니다. 빌드가 아무것도 내지 않았습니다."
            exit 1
          fi
          if [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error::dist/assets가 비어 있습니다. 번들이 만들어지지 않았습니다."
            exit 1
          fi
          for p in node_modules package.json package-lock.json vitest.config.js eslint.config.js tsconfig.json; do
            if [ -e "dist/$p" ]; then
              echo "::error::dist/$p 가 배포 대상에 들어 있습니다. public/ 아래에 있는지 확인하세요."
              exit 1
            fi
          done
          echo "dist 점검 통과"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npx firebase-tools deploy --only hosting:poster-studio --project inky-poster-studio --non-interactive
      # 배포 직후 라이브 확인. **주소가 두 개이고 둘 다 살아 있어야 한다**(2026-09-10):
      #   poster.edutogether.kr  정식 주소 — 사람에게 주는 주소
      #   poster-studio.web.app  이미 나간 QR·링크가 죽으면 안 되므로 유지
      # 🔴 예전에는 옛 주소 하나만 봤다. 그러면 **정식 주소가 죽어도 CI가 초록불**이다 —
      # "맞다"가 아니라 "특정한 틀린 답이 아니다"만 보는 형태다(COMMON_STANDARDS §21-5).
      # 그래서 둘 다 보고, **하나라도 실패하면 실패**로 둔다.
      - name: 배포 직후 라이브 확인 (두 주소 · 200 + 404 + CORS)
        run: |
          FAILED=0
          for HOST in "https://poster.edutogether.kr" "https://poster-studio.web.app"; do
            echo "-- $HOST --"

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HOST/")
            echo "  홈: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::error::$HOST 가 200을 안 줍니다(상태: $STATUS)"
              FAILED=1
            fi

            # public/ 아래 설정파일이 dist/로 새어 나가면 그대로 서빙된다 —
            # 이 저장소가 vitest.config.js로 실제로 겪은 함정이라 주소마다 확인한다.
            LEAK=$(curl -s -o /dev/null -w "%{http_code}" "$HOST/vitest.config.js")
            echo "  나가면 안 되는 경로: $LEAK"
            if [ "$LEAK" != "404" ]; then
              echo "::error::$HOST/vitest.config.js 가 404가 아닙니다(상태: $LEAK)"
              FAILED=1
            fi

            # 공유 카드 그림. 주소만 바꾸고 파일이 없으면 카카오톡 카드에 그림이 안 뜨는데
            # 화면은 멀쩡해서 아무도 모른다 — 200과 content-type을 같이 본다.
            # (200만 보면 안 된다: 없는 경로에도 200 + text/html을 주는 서버가 있다.)
            OG=$(curl -s -o /dev/null -w "%{http_code} %{content_type}" "$HOST/og.jpg")
            echo "  og.jpg: $OG"
            case "$OG" in
              "200 image/jpeg"*) ;;
              *) echo "::error::$HOST/og.jpg 가 200 + image/jpeg가 아닙니다($OG). 공유 카드에 그림이 안 뜹니다."; FAILED=1 ;;
            esac

            # 헤더가 "있는지"만 보면 값이 다른 오리진이거나 *여도 통과한다 —
            # ALLOWED_ORIGINS의 앵커(^…$)를 지키는 것이 이 저장소 규칙이라
            # **보낸 오리진을 그대로 돌려주는지**까지 본다.
            CORS_HEADER=$(curl -s -D - -o /dev/null -H "Origin: $HOST"               -X OPTIONS "https://asia-northeast3-inky-poster-studio.cloudfunctions.net/posterStudio/generate"               | grep -i "access-control-allow-origin" || true)
            echo "  CORS: $CORS_HEADER"
            case "$CORS_HEADER" in
              *"$HOST"*) echo "  CORS 오리진 정확히 반사됨" ;;
              "") echo "::error::$HOST 가 functions/index.js의 ALLOWED_ORIGINS에 없습니다."; FAILED=1 ;;
              *) echo "::error::$HOST 에 대한 CORS 헤더가 보낸 오리진을 안 돌려줍니다: $CORS_HEADER"; FAILED=1 ;;
            esac
          done
          if [ "$FAILED" != "0" ]; then
            echo "::error::두 주소 중 하나 이상이 확인에 실패했습니다. 하나만 살아도 통과시키지 않습니다."
            exit 1
          fi
          echo "두 주소 전부 확인 통과"
