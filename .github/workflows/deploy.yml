name: Test, Deploy Functions, Deploy Pages

# 코디세이(codyssey-calendar)의 CI 기준에 맞춘 단일 워크플로우 —
# lint+테스트 통과 → functions 배포 → (성공해야) Pages 배포, 순서 강제.
# 포스터 스튜디오는 Firestore/Storage를 아예 안 써서(사진은 처리 직후 삭제,
# DB 미사용 — CLAUDE.md 참고) 코디세이의 "Firestore 규칙 에뮬레이터 테스트"에
# 대응하는 단계는 없다.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm test
        working-directory: public

  deploy-functions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      # github-actions-deploy 서비스 계정은 project-level roles/secretmanager.secretAccessor
      # (값 읽기, secrets.versions.access) + roles/secretmanager.viewer(존재/메타데이터
      # 조회, secrets.get — firebase-tools가 배포 시점에 필요) 둘 다 있어야 한다.
      # Secret Accessor 하나만으로는 secrets.get이 없어서 배포가 403으로 막힌다
      # (2026-08-29 실제로 겪고 원인 확인함).
      - run: npx firebase-tools deploy --only functions --project inky-poster-studio --non-interactive

  deploy-pages:
    needs: [test, deploy-functions]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
