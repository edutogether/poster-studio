name: PR Check

# PR(대상 master)이면 사람이 요청하지 않아도 도는 검사(2026-09-27 대표 지시).
# Codex 클라우드 등이 올린 PR이 master에 들어가기 전에, 배포 워크플로(deploy.yml)가
# 배포 **전에** 돌리는 검사를 똑같이 돌린다 — test 잡 전부 + 빌드·dist 점검.
#
# 🔴 여기에는 배포·비밀 키·라이브 호출이 **없다.** 그래서 트리거는 pull_request다
#    (pull_request_target은 비밀 키에 접근할 수 있어 쓰지 않는다). 권한도 읽기뿐이다.
# 🟠 deploy.yml의 검사 단계를 바꾸면 여기도 같이 바꾼다 — 둘이 어긋나면
#    PR에서는 초록인데 master에서 막히는(또는 그 반대) 일이 생긴다.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run fonts:check
      - run: npm test
      - run: npm run verify:selftest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      # deploy.yml의 같은 이름 단계와 같은 검사다(배포 직전에 도는 것).
      - name: dist에 나가면 안 되는 것이 없는지
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html이 없습니다. 빌드가 아무것도 내지 않았습니다."
            exit 1
          fi
          if [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error::dist/assets가 비어 있습니다. 번들이 만들어지지 않았습니다."
            exit 1
          fi
          for p in node_modules package.json package-lock.json vitest.config.js eslint.config.js tsconfig.json; do
            if [ -e "dist/$p" ]; then
              echo "::error::dist/$p 가 배포 대상에 들어 있습니다. public/ 아래에 있는지 확인하세요."
              exit 1
            fi
          done
          echo "dist 점검 통과"
