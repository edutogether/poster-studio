name: Deploy Firebase Functions

on:
  workflow_dispatch:
  # FIREBASE_SERVICE_ACCOUNT 저장소 시크릿이 등록되면 아래 주석을 풀어서
  # push 시 자동 배포로 전환할 것. 지금 켜두면 시크릿이 없어서 매번 실패한다.
  # push:
  #   branches: [master]
  #   paths: ['functions/**', '.github/workflows/functions-deploy.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
      - run: npm test
        working-directory: public
      # 아래 두 스텝은 GCP 자격증명이 GitHub 저장소 시크릿(FIREBASE_SERVICE_ACCOUNT)에
      # 등록돼 있어야 동작한다. 서비스 계정 생성·키 발급은 GCP 콘솔 권한이 필요한
      # 작업이라 이 세션(auto mode classifier)이 대신할 수 없다 — CLAUDE.md의
      # "functions/ CI 배포" 항목 참고, 대표가 콘솔에서 한 번 설정해야 한다.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - run: npx firebase-tools deploy --only functions --project inky-poster-studio --non-interactive
