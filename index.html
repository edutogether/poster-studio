<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>InKY Poster Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@500;700;900&family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <!-- Pretendard는 자체 호스팅(fonts/pretendard.css) — jsDelivr(GitHub raw) CDN 단일장애점 제거.
       Black Han Sans·Noto Serif KR 등 나머지는 학생이 입력하는 임의의 한글 텍스트 전체를
       커버하려면 자체 호스팅 시 폰트 용량이 수십 MB로 불어나 Google Fonts CDN(자체 서브셋팅)을
       그대로 쓰는 게 낫다고 판단함 — CLAUDE.md 참고. -->
  <link rel="stylesheet" href="fonts/pretendard.css" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 부트 스플래시 — _shared/standards/splash-standard.md 규격(2026-09-09 4단계).
       **마크업은 여기 정적으로 둔다.** React가 그리면 번들을 받아 실행할 때까지 빈
       화면이 보인다(표준 §7: 다른 앱이 실제로 겪은 회귀다).
       **타이밍은 CSS 애니메이션이 잡는다**(style.css의 splashOut) — JS 타이머로 재면
       번들 로드 시점부터 재는 셈이라 회선·기기마다 달라진다. 예전 구현이 그랬다.
       JS(boot-splash.js)는 시간을 재지 않고 **끝났는지만 보고 노드를 치운다.** -->
  <div id="splash">
    <div class="logo">🎬</div>
    <div class="name">InKY <span class="gold">Poster Studio</span></div>
    <div class="stagline">사진 한 장, 내가 영화의 주인공이 된다</div>
    <span class="sbar"><i></i></span>
  </div>
  <script src="/boot-splash.js"></script>
  <header class="topbar">
    <div class="brand">
      <span class="reel">🎬</span>
      <div>
        <p class="eyebrow">제4회 인천어린이청소년영화제</p>
        <h1>InKY Poster Studio</h1>
        <!-- 부제를 제목 바로 밑으로 옮겼다(2026-09-09 대표 지시). 예전엔 오른쪽 위
             tagWrap 안에 오른쪽 정렬로 있었는데, 제목과 떨어져 있어 무엇에 대한
             설명인지 잘 안 붙었다. 오른쪽 위에는 아무것도 남지 않는다. -->
        <p class="tagline">사진 한 장으로 — 내가 영화의 주인공이 된다</p>
      </div>
    </div>
  </header>

  <!-- 앱 화면은 React가 이 main 안에 그린다(src/main.tsx). main 자체를 루트로 삼는 이유는
       루트용 <div>를 새로 끼우면 body와 main 사이에 없던 요소가 하나 생겨 레이아웃
       계산이 달라질 수 있어서다 — 결과물은 바뀌면 안 된다. -->
  <main class="app"></main>

  <!-- 4차 정식감사 🔴 항목: 아동 개인정보 처리에 대한 화면 내 고지 링크.
       2026-09-09 대표 지시로 오른쪽 위 → 페이지 맨 아래 가운데로 옮겼다
       (Voice Cinema와 같은 자리). 문구도 Voice Cinema와 같은 "개인정보처리방침"으로
       맞추면서 끝의 ↗를 뺐다.
       target="_blank"는 그대로 둔다 — 같은 탭에서 열면 촬영해둔 사진이 든
       세션이 통째로 날아간다. 아이가 촬영 후 이 링크를 눌렀을 때 실제로
       일어나는 일이라 문구보다 우선한다. -->
  <!-- 항상 같은 안내문을 패널 바깥 맨 아래에 모은다(2026-09-09 대표 지시
       "맨 마지막에 박스 바깥에 당구장 붙여서 말하면 되잖아").
       **오류·상태 표시는 여기 오지 않는다** — 그건 #status 자리에 그대로 있어야 한다.
       여기 오는 것은 화면이 켜져 있는 내내 똑같은 문장뿐이다. -->
  <footer class="pagefoot">
    <ul class="notes">
      <li>카메라를 켜고 사진을 촬영해 주세요.</li>
      <li>출연진은 선택 항목이며 쉼표로 구분해 적어 주세요.</li>
    </ul>
    <a class="privacyLink" href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
  </footer>

  <!-- 앱 번들 하나만 로드한다. 좌우 컬럼 높이 맞춤(예전 layout-match.js)은
       React 훅(src/useLayoutMatch.ts)으로 들어갔다 — 고전 <script>로 두면
       파싱 시점에 돌면서 아직 없는 .left/.right를 찾고 조용히 아무 일도
       안 하게 된다. -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
