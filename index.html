<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>InKY Poster Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Serif+KR:wght@500;700;900&family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <!-- Pretendard는 자체 호스팅(fonts/pretendard.css) — jsDelivr(GitHub raw) CDN 단일장애점 제거.
       Black Han Sans·Noto Serif KR 등 나머지는 학생이 입력하는 임의의 한글 텍스트 전체를
       커버하려면 자체 호스팅 시 폰트 용량이 수십 MB로 불어나 Google Fonts CDN(자체 서브셋팅)을
       그대로 쓰는 게 낫다고 판단함 — CLAUDE.md 참고. -->
  <link rel="stylesheet" href="fonts/pretendard.css" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- 부트 스플래시. 스타일을 인라인으로 적는 이유: 외부 스타일시트가 도착해
       화면이 처음 그려지는 그 순간, 이미 완성된 브랜드 화면이 보이게 하려는
       것이다. 배경은 앱과 같은 --bg(#0d0f14)라 앱으로 넘어갈 때 색이 안 튄다.
       app.js가 초기 플레이스홀더 포스터를 그리고 나면(첫 의미있는 화면) 페이드아웃한다.
       2026-09-03 3라운드: 그라디언트 글로우를 걷어내고 단색 배경 + 절제된 배지로 정리. -->
  <div id="bootSplash" style="position:fixed;top:0;left:0;right:0;height:100vh;height:100svh;z-index:9999;overflow:hidden;background:#0d0f14;transition:opacity .45s ease;will-change:opacity">
    <!-- 5라운드(2026-09-03) — 대표 재지적: "스플래시일 때 뒤가 다 보여, 검은
         배경에 로딩이 되어야" + 버벅임/덜컹거림. 4라운드에서 스플래시를
         투명하게 만들어 body::before(포스터월)가 비쳐 보이게 했었는데, 그게
         오히려 "로딩 중에 배경이 산만하게 다 비쳐 보인다"는 새 불만과
         무거운 이미지 디코딩이 로딩 임계경로에 끼어드는 버벅임 둘 다의
         원인이었다. 다시 완전 불투명(#0d0f14)으로 되돌려 로딩 중엔 순수
         검은 화면 + 로고/문구만 뜨게 하고, 배경 이미지는 스플래시가 걷힌
         뒤(app.js가 첫 화면을 그린 다음)에만 보이게 한다. -->
    <div style="position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 20%,rgba(13,15,20,.35),transparent 60%),linear-gradient(180deg,rgba(13,15,20,.15) 0%,rgba(13,15,20,.7) 60%,#0d0f14 92%)"></div>
    <div style="position:relative;z-index:1;height:100%;display:grid;place-items:center;align-content:center;gap:22px">
      <span style="display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:#16181f;border:1px solid rgba(255,255,255,.1);font-size:32px">
        🎬
      </span>
      <span style="display:grid;justify-items:center;gap:8px;text-align:center">
        <span style="color:#e9b949;font-size:13px;font-weight:700;letter-spacing:.3em;padding-left:.3em">POSTER STUDIO</span>
        <span style="color:#f2f3f6;font-size:20px;font-weight:700;letter-spacing:-.01em">사진 한 장, 내가 영화의 주인공이 된다</span>
      </span>
      <span style="display:block;width:160px;height:2px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden">
        <span style="display:block;width:40%;height:100%;border-radius:99px;background:#e9b949;animation:poster-studio-boot-bar 1.15s ease-in-out infinite"></span>
      </span>
    </div>
    <style>@keyframes poster-studio-boot-bar{0%{margin-left:-40%}100%{margin-left:100%}}</style>
  </div>
  <script src="/boot-splash.js"></script>
  <header class="topbar">
    <div class="brand">
      <span class="reel">🎬</span>
      <div>
        <p class="eyebrow">제4회 인천어린이청소년영화제</p>
        <h1>InKY AI 영화 포스터 제작소</h1>
      </div>
    </div>
    <div class="tagWrap">
      <p class="tagline">사진 한 장으로 — 내가 영화의 주인공이 된다</p>
      <!-- 4차 정식감사 🔴 항목: 아동 개인정보 처리에 대한 화면 내 고지.
           예전엔 이 자리에 전체 안내문을 길게 풀어뒀는데(대표 지시, 2026-09-03),
           본문은 privacy.html로 옮기고 여기엔 짧은 링크만 남긴다 — 고지 내용
           자체는 그대로 유지, 노출 방식만 바뀜. -->
      <a class="privacyLink" href="privacy.html" target="_blank" rel="noopener">개인정보 처리방침 보기 ↗</a>
    </div>
  </header>

  <!-- 앱 화면은 React가 이 main 안에 그린다(src/main.tsx). main 자체를 루트로 삼는 이유는
       루트용 <div>를 새로 끼우면 body와 main 사이에 없던 요소가 하나 생겨 레이아웃
       계산이 달라질 수 있어서다 — 결과물은 바뀌면 안 된다. -->
  <main class="app"></main>

  <!-- 앱 번들 하나만 로드한다. 좌우 컬럼 높이 맞춤(예전 layout-match.js)은
       React 훅(src/useLayoutMatch.ts)으로 들어갔다 — 고전 <script>로 두면
       파싱 시점에 돌면서 아직 없는 .left/.right를 찾고 조용히 아무 일도
       안 하게 된다. -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
